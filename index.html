<script>
/* Signalement d'erreur : dit quel morceau de l'appli a un problème (le reste continue de marcher) */
var FERR=[],FMOD={'base.js':'la base de l’appli','donnees.js':'l’onglet Données','moi.js':'l’onglet Moi','profil.js':'le profil et les trophées','seance.js':'les séances','objectifs.js':'les objectifs, le coach et la VO2 max','glow.js':'l’onglet Glow up','variantes.js':'les variantes d’exercices','mascotte.js':'la mascotte','demarrage.js':'le démarrage','style.css':'le design'};
function ferrEsc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ferrLog(where,msg){FERR.push({t:new Date().toISOString(),where:where,msg:String(msg)});ferrShow()}
function ferrShow(){
  var b=document.getElementById('ferr');if(!b){b=document.createElement('div');b.id='ferr';document.body.appendChild(b)}
  var w=[];FERR.forEach(function(x){if(w.indexOf(x.where)<0){w.push(x.where)}});
  b.innerHTML='<b>⚠️ Un morceau de l’appli a un souci</b><span>'+ferrEsc(w.map(function(x){return FMOD[x]||x}).join(', '))+'. Le reste fonctionne.</span><div><button onclick="ferrCopy(this)">Copier le détail</button><button onclick="this.parentNode.parentNode.remove()">Fermer</button></div>';
}
function ferrText(){return 'Forme '+(window.FORME_V||'')+' · '+navigator.userAgent+'\n'+FERR.map(function(x){return x.t+' · '+x.where+' · '+x.msg}).join('\n')}
function ferrCopy(btn){var t=ferrText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){btn.textContent='Copié ✓'}).catch(function(){prompt('Copie ce texte :',t)})}
function errCard(tab,msg){return '<div class="g errc"><div class="eri"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div><b>L’onglet '+ferrEsc(tab)+' a rencontré un problème</b><div class="note">Le reste de l’appli fonctionne. Copie le détail et envoie-le pour qu’on le corrige.</div><pre class="errp">'+ferrEsc(msg)+'</pre><div class="tmr"><button class="g pill on" onclick="ferrCopy(this)">Copier le détail</button><button class="g pill" onclick="location.reload()">Recharger</button></div></div>'}
window.addEventListener('error',function(e){
  var t=e.target;
  if(t&&t!==window&&(t.tagName==='SCRIPT'||t.tagName==='LINK')){var f=(t.src||t.href||'').split('/').pop().split('?')[0];ferrLog(f,'fichier introuvable : vérifie qu’il est bien sur GitHub');return}
  var f2=(e.filename||'').split('/').pop().split('?')[0];if(!FMOD[f2]){return}
  ferrLog(f2,(e.message||'erreur')+' (ligne '+e.lineno+')');
},true);
</script>
