<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Forme</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050506">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#050506;--t:#F7F7F8;--m:rgba(var(--fgr),.52);--l:rgba(var(--fgr),.12);--a:var(--fg);--b:var(--fg);--fg:#FFFFFF;--fgr:255,255,255;--bgr:5,5,6;--c:#9EA2AA;--ok:#7FCFA3;--ko:#E8906F;--sp:cubic-bezier(.34,1.4,.64,1);--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--t);font:15px/1.4 -apple-system,"SF Pro Text",Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:110vmax;height:110vmax;border-radius:50%;opacity:.26;animation:drift 38s ease-in-out infinite alternate;will-change:transform}
.bg i:nth-child(1){background:radial-gradient(closest-side,#FFFFFF,rgba(255,255,255,0));left:-30vmax;top:-25vmax}
.bg i:nth-child(2){background:radial-gradient(closest-side,#A4A8B0,rgba(164,168,176,0));right:-35vmax;top:25vh;animation-delay:-12s}
.bg i:nth-child(3){background:radial-gradient(closest-side,#6A6E76,rgba(106,110,118,0));left:-10vmax;bottom:-35vmax;animation-delay:-24s;opacity:.14}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
#app{max-width:430px;margin:0 auto;padding:0 0 120px}
#hd{position:sticky;top:0;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid transparent;transition:background .5s var(--ease),border-color .5s}
#hd.sc{background:rgba(var(--bgr),.5);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-color:var(--l)}
h1{margin:0;font-size:var(--fs,34px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.035em;transition:font-size .5s var(--ease)}
#hd.sc h1{font-size:20px}
.sub{color:var(--m);font-size:13px;margin-top:2px;max-height:20px;transition:opacity .4s,max-height .4s}
#hd.sc .sub{opacity:0;max-height:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--sp)}
.g,.gb{background:linear-gradient(160deg,rgba(var(--fgr),.12),rgba(var(--fgr),.03) 55%,rgba(var(--fgr),.06));border:1px solid var(--l);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);box-shadow:inset 0 1px 0 rgba(var(--fgr),.24),inset 0 -1px 0 rgba(var(--fgr),.04),0 26px 60px -14px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.35)}
.gb:active{transform:scale(.9) rotate(60deg)}
.g{position:relative;border-radius:28px;padding:18px;transition:transform .5s var(--sp)}
.g::before,.gb::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.42),rgba(255,255,255,.06) 32%,rgba(255,255,255,0) 60%,rgba(255,255,255,.14));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gb{position:relative}
.g.tap{cursor:pointer}.g.tap:active{transform:scale(.965)}
.view{display:none;padding:0 16px}.view.on{display:block;animation:in .6s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.full{grid-column:1/-1}
.lab{color:var(--m);font-size:13px}
.big{font-size:40px;font-weight:700;letter-spacing:-.035em;margin-top:6px;white-space:nowrap}
.big small,.val small{font-size:14px;color:var(--m);font-weight:500;margin-left:5px;letter-spacing:0}
.val{font-size:28px;font-weight:650;letter-spacing:-.025em;margin-top:6px;white-space:nowrap}
.empty{color:var(--m)}
.note{color:var(--m);font-size:12.5px;margin-top:4px}
.car{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-20px -16px -34px;padding:24px 16px 48px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 88%;scroll-snap-align:center;transition:transform .15s linear,opacity .15s linear}
.dots{position:relative;display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(var(--fgr),.25);transition:width .5s var(--sp),background .4s}
.dots i.on{width:18px;background:var(--t)}
.sp{display:flex;gap:5px;align-items:flex-end;height:44px;margin-top:16px}
.sp i{flex:1;border-radius:5px;background:linear-gradient(180deg,var(--a),rgba(var(--fgr),.1));animation:grow .9s var(--ease) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.rings{display:flex;justify-content:space-between;margin-top:16px}
.rg{position:relative;text-align:center;width:30%}
.rg svg{width:100%;height:auto;max-width:84px;transform:rotate(-90deg);stroke-width:8}
.rt{stroke:rgba(var(--fgr),.09)}.rf{stroke-linecap:round;animation:ring 1.3s var(--ease) both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.rg b{position:absolute;top:30%;left:0;right:0;font-size:15px}
.rg span{display:block;color:var(--m);font-size:12px;margin-top:4px}
.tr{height:5px;background:rgba(var(--fgr),.1);border-radius:5px;overflow:hidden;margin-top:8px}
.tr i{display:block;height:100%;border-radius:5px;background:rgba(var(--fgr),.55);transition:width 1s var(--ease)}
.tr i.w{background:linear-gradient(90deg,#B85F3F,#F0A77F);box-shadow:0 0 14px rgba(232,144,111,.35)}.tr i.g{background:linear-gradient(90deg,#3F9A72,#A3E4C2);box-shadow:0 0 14px rgba(127,207,163,.35)}
.mrow{margin-top:14px}.mrow>div:first-child{display:flex;justify-content:space-between;font-size:13px}.mrow span:last-child{color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid rgba(232,144,111,.28);background:rgba(232,144,111,.09);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--ko)}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:8px 16px;border-radius:99px;border:1px solid var(--l);background:rgba(var(--fgr),.05);color:var(--m);font-weight:500;transition:all .5s var(--sp)}
.pill.on{background:rgba(var(--fgr),.16);color:var(--t);transform:scale(1.04)}
.seg{position:relative;display:flex;padding:3px;border-radius:14px;margin-bottom:12px}
.seg button{position:relative;z-index:1;flex:1;padding:9px;color:var(--m);font-weight:500;transition:color .4s}.seg button.on{color:var(--t)}
.seg u{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:11px;background:rgba(var(--fgr),.15);transition:transform .6s var(--sp)}
.seg.y u{transform:translateX(100%)}
h2{font-size:17px;font-weight:600;margin:26px 4px 10px;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.row>span:first-child{color:var(--m)}
.lift{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.lift>div:last-child{flex:0 0 auto}.lift b{font-weight:600;font-size:16px}
.rm{text-align:right;white-space:nowrap;font-size:22px;font-weight:650;letter-spacing:-.02em}.rm small{font-size:12px;color:var(--m)}
.li{margin-bottom:12px;animation:in .6s var(--ease) both}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none;z-index:8}
nav div{pointer-events:auto;position:relative;display:flex;padding:5px;border-radius:99px;background:rgba(30,30,32,.45);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--l);box-shadow:inset 0 1px 0 rgba(var(--fgr),.18),0 16px 40px rgba(0,0,0,.5)}
nav u{position:absolute;top:5px;bottom:5px;left:0;border-radius:99px;background:rgba(var(--fgr),.14);box-shadow:inset 0 1px 0 rgba(var(--fgr),.2);transition:transform .65s var(--sp),width .65s var(--sp)}
nav button{position:relative;z-index:1;display:flex;align-items:center;padding:11px 15px;border-radius:99px;color:var(--m);font-size:13.5px;font-weight:500;transition:color .4s}
nav button span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .6s var(--sp),opacity .4s,margin .6s var(--sp)}
nav button.on span{max-width:100px;opacity:1;margin-left:7px}
nav button.on{color:var(--t)}nav button svg{width:18px;height:18px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);opacity:0;pointer-events:none;transition:opacity .6s var(--ease),backdrop-filter .6s;z-index:10}
#sh{position:fixed;left:50%;bottom:0;top:6%;width:100%;max-width:430px;transform:translate(-50%,104%);transition:transform .7s var(--ease);overflow-y:auto;z-index:11;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 32px);border-radius:34px 34px 0 0;background:rgba(24,24,26,.68);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--l);border-bottom:0;box-shadow:inset 0 1px 0 rgba(var(--fgr),.18)}
body.open #ov{opacity:1;pointer-events:auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.open #sh{transform:translate(-50%,46%)}body.open.full #sh{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(var(--fgr),.28);margin:0 auto 14px;cursor:pointer;position:relative}
.grab:after{content:"";position:absolute;inset:-14px -40px}
.st{color:rgba(var(--fgr),.62);font-size:12.5px;font-weight:600;letter-spacing:.02em;margin:22px 4px 2px}
.nl{color:var(--m);font-size:12.5px;margin:8px 4px 0;line-height:1.45}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bars{display:flex;gap:8px;height:130px;margin-bottom:6px}
.b{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center}.col{flex:1;width:100%;display:flex;align-items:flex-end}
.col i{width:100%;border-radius:8px;background:linear-gradient(180deg,var(--a),rgba(var(--fgr),.1));transform-origin:bottom;animation:grow .9s var(--ease) both}
.b.n i{background:rgba(var(--fgr),.07)}.b span{font-size:11px;color:var(--m)}.b em{font-size:10.5px;color:var(--m);font-style:normal;min-height:13px}
.sr{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;margin-bottom:10px}
.sr b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.srch{width:100%;padding:13px 18px;border-radius:18px;color:var(--t);font:inherit;outline:none}
.srch::placeholder{color:var(--m)}
.rc{padding:16px 18px;border-radius:22px;margin-top:10px}.rc .rt{font-weight:600;font-size:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px}
.kv span{display:block;color:var(--m);font-size:11.5px;line-height:1.3}.kv b{font-weight:550;font-size:14.5px;word-break:break-word}
.tw{padding:0;overflow:auto;border-radius:22px;margin-top:10px}
.tw table{border-collapse:collapse;font-size:13px;min-width:100%}
.tw th,.tw td{padding:10px 12px;border-bottom:1px solid var(--l);white-space:nowrap;text-align:left}
.tw td.lg{white-space:normal;min-width:220px}
.tw th{color:var(--m);font-weight:500;font-size:12px}
.tw td:first-child,.tw th:first-child{position:sticky;left:0;background:rgba(20,22,30,.94);z-index:1}
.tw tr.sec td{position:static;background:none;color:var(--a);font-weight:600;font-size:12.5px;padding-top:18px;white-space:normal}
.fade{position:fixed;left:0;right:0;pointer-events:none;z-index:5}.ft{top:0;height:70px;background:linear-gradient(var(--bg),rgba(var(--bgr),0))}.fb{bottom:0;height:150px;background:linear-gradient(rgba(var(--bgr),0),rgba(var(--bgr),.92) 80%)}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -4px}}
.slide,.hero-c,.grid>.g,#v-force>.g:first-child{animation:fl 7s ease-in-out infinite}.grid>.g:nth-child(2n){animation-delay:-2.3s}.grid>.g:nth-child(3n){animation-delay:-4.1s}.slide:nth-child(2){animation-delay:-1.7s}.slide:nth-child(3){animation-delay:-3.4s}
nav div{animation:fl 9s ease-in-out infinite}
.big,h1{font-family:-apple-system,"SF Pro Display",Roboto,system-ui,sans-serif}
.tok{color:var(--ok)!important}.tko{color:var(--ko)!important}
.bd{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:550;white-space:nowrap}
.bd i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.bd.ok{color:var(--ok);background:rgba(127,207,163,.1);border:1px solid rgba(127,207,163,.26)}.bd.ko{color:var(--ko);background:rgba(232,144,111,.1);border:1px solid rgba(232,144,111,.26)}.bd.nt{color:rgba(var(--fgr),.8);background:rgba(var(--fgr),.06);border:1px solid var(--l)}
.col i.ko{background:linear-gradient(180deg,#F0A77F,rgba(232,144,111,.18))}.col i.ok{background:linear-gradient(180deg,#A3E4C2,rgba(127,207,163,.18))}
.sp i.ko{background:linear-gradient(180deg,#F0A77F,rgba(232,144,111,.15))}
.hero{display:flex;gap:18px;align-items:center;margin-top:6px}.hero .hr{position:relative;flex:0 0 118px;height:118px}.hero .hr svg{width:118px;height:118px;transform:rotate(-90deg);stroke-width:9}
.hero .hr b{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-weight:700;letter-spacing:-.03em}
.al{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--l);font-size:13.5px;line-height:1.4}.al:last-child{border:0;padding-bottom:2px}
.al i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;box-shadow:0 0 10px currentColor;background:currentColor}
.ln text.ax{fill:var(--m)}.ln text{stroke:none;font-family:inherit;font-weight:500}.ln{width:100%;height:auto;display:block;margin:4px 0 2px;overflow:visible}.ln .dr{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-180%);padding:10px 18px;border-radius:99px;z-index:20;font-size:13px;white-space:nowrap;transition:transform .6s var(--sp)}#toast.on{transform:translate(-50%,0)}
.srch[type=password]:not(:placeholder-shown){letter-spacing:.15em}

/* ---------- Mode clair ---------- */
body.light{--bg:#EEF0F3;--t:#0D0E11;--m:rgba(13,14,17,.55);--l:rgba(13,14,17,.08);--fg:#16171B;--fgr:22,23,27;--bgr:238,240,243;color-scheme:light}
html.light{background:#EEF0F3}
body.light .bg i{opacity:.7}body.light .bg i:nth-child(1){background:radial-gradient(closest-side,#FFFFFF,rgba(255,255,255,0))}body.light .bg i:nth-child(2){background:radial-gradient(closest-side,#C9CED8,rgba(201,206,216,0))}body.light .bg i:nth-child(3){background:radial-gradient(closest-side,#DCE6EF,rgba(220,230,239,0))}
body.light .g,body.light .gb{background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.62) 55%,rgba(255,255,255,.78));border-color:rgba(13,14,17,.06);box-shadow:inset 0 1px 0 #fff,0 22px 50px -20px rgba(30,36,52,.28),0 2px 6px rgba(30,36,52,.07)}
body.light nav div{background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 #fff,0 16px 40px rgba(30,36,52,.18)}
body.light #sh{background:rgba(246,247,249,.88)}
body.light #hd.sc{background:rgba(238,240,243,.7)}
body.light .col i,body.light .sp i{background:linear-gradient(180deg,#2A2C33,rgba(22,23,27,.12))}
body.light .col i.ko,body.light .sp i.ko{background:linear-gradient(180deg,#D9744F,rgba(217,116,79,.15))}
body.light .col i.ok{background:linear-gradient(180deg,#3E9E73,rgba(62,158,115,.15))}
body.light .tr i.g{background:linear-gradient(90deg,#2F8A62,#69C79A)}body.light .tr i.w{background:linear-gradient(90deg,#B4532F,#E58C67)}
body.light{--ok:#2F9467;--ko:#D46A43}

/* ---------- Salutation, interrupteur, onglets de la feuille ---------- */
.hi{font-size:13px;color:var(--m);margin-top:3px}
.sw{position:relative;width:52px;height:32px;border-radius:99px;background:rgba(var(--fgr),.14);transition:background .4s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .5s var(--sp)}
.sw.on{background:var(--ok)}.sw.on i{transform:translateX(20px)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-radius:20px;margin-bottom:10px}
#subnav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:7;display:flex;justify-content:center;padding:0 16px;pointer-events:none;opacity:0;transform:translateY(16px);transition:opacity .45s var(--ease),transform .6s var(--sp)}
body.tab-data #subnav{opacity:1;transform:none}
#subnav div{pointer-events:auto;max-width:398px;width:100%;display:flex;gap:6px;overflow-x:auto;padding:6px;border-radius:99px;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
#subnav div::-webkit-scrollbar{display:none}
#subnav button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:500;color:var(--m);transition:background .4s,color .4s}
#subnav button svg{width:15px;height:15px}
#subnav button.on{background:rgba(var(--fgr),.14);color:var(--t)}
body.tab-data #app{padding-bottom:180px}
#sn,#toast,.gb{-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}
/* transition de thème */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
html.tt *,html.tt *::before{transition:background-color .9s ease,color .9s ease,border-color .9s ease,box-shadow .9s ease,fill .9s ease,stroke .9s ease!important}
/* emoji */
.emo{display:inline-block;margin-left:.18em;transform-origin:70% 75%;animation:wave 2.4s ease-in-out .5s 1}
@keyframes wave{0%,60%,100%{rotate:0deg}10%{rotate:16deg}20%{rotate:-9deg}30%{rotate:14deg}40%{rotate:-5deg}50%{rotate:9deg}}
/* camemberts */
.dn{width:136px;height:136px;flex:0 0 136px}.dn .ds{animation:dsin 1s var(--ease) both}
@keyframes dsin{from{opacity:0;stroke-width:4}}
.dn .dv{fill:var(--t);font-size:24px;font-weight:700;letter-spacing:-.02em;stroke:none}.dn .dl{fill:var(--m);font-size:11px;stroke:none}
.dw{display:flex;align-items:center;gap:16px;margin-top:8px}
.lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.lg div{display:flex;align-items:center;gap:9px;font-size:13px}.lg i{flex:0 0 9px;height:9px;border-radius:3px}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--m)}.lg b{font-weight:600}
.lg.row{flex-direction:row;flex-wrap:wrap;gap:14px;margin:6px 0 4px}

.newses .ic{width:46px;height:46px;border-radius:15px;background:var(--t);color:var(--bg);font-size:26px;font-weight:300;display:grid;place-items:center;flex:0 0 auto}
.newses b{display:block;font-size:16px}
.sef{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.sef span{display:block;font-size:12px;color:var(--m);margin:0 4px 6px}.sef input{margin:0}
.seempty{text-align:center;margin-top:14px;padding:26px 18px}.seempty b{display:block;margin:6px 0 4px}
.seadd{width:100%;margin-top:12px;padding:14px;font-weight:600}
.sex{margin-top:12px;padding:14px 14px 16px}.sexh{display:flex;gap:12px;align-items:center}.sexh .exi{flex:0 0 52px;height:52px}.sexh b{font-size:15.5px}
.sexx{width:32px;height:32px;border-radius:50%;color:var(--m);background:rgba(var(--fgr),.06);flex:0 0 auto}
.selast{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 10px;padding:9px 12px;border-radius:14px;background:rgba(var(--fgr),.05);font-size:12.5px}
.selast span{color:var(--m)}.selast b{font-weight:600}.selast button{margin-left:auto;padding:5px 11px;border-radius:99px;background:rgba(var(--fgr),.12);font-size:12px;font-weight:600}
.sehd,.serow{display:grid;grid-template-columns:22px 1.15fr .9fr .8fr .9fr 26px;gap:6px;align-items:center}
.sehd{font-size:11px;color:var(--m);margin:4px 0 2px;text-align:center}.sehd span:first-child{text-align:left}
.serow{margin-top:6px}.serow b{font-size:13px;color:var(--m);text-align:center}
.serow input{width:100%;min-width:0;padding:10px 4px;border-radius:12px;border:1px solid var(--l);background:rgba(var(--fgr),.06);color:var(--t);font:inherit;font-size:15px;font-weight:600;text-align:center;outline:none;transition:border-color .3s,background .3s}
.serow input:focus{border-color:rgba(var(--fgr),.45);background:rgba(var(--fgr),.1)}
.serow button{color:var(--m);font-size:13px;height:32px}
.serow.sec{grid-template-columns:auto 1fr auto;margin-top:8px}.serow.sec span,.serow.sec em{font-size:13px;color:var(--m);font-style:normal}
.sepr{margin:4px 0 0 28px;font-size:12px;color:#E9BC4C;animation:obin .5s var(--ease)}
.sefat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.sefat button{padding:10px 2px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .45s var(--sp),box-shadow .3s}
.sefat span{font-size:22px}.sefat small{font-size:10.5px;color:var(--m)}.sefat button.on{box-shadow:inset 0 0 0 1.5px var(--t);transform:scale(1.05)}
.sesum{display:flex;justify-content:space-around;margin:18px 0 4px;font-size:12.5px;color:var(--m)}.sesum b{display:block;text-align:center;font-size:20px;color:var(--t)}
textarea.srch{resize:none;font:inherit}
.pkr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--l);cursor:pointer}.pkr:last-child{border:0}.pkr .exi{flex:0 0 46px;height:46px;border-radius:14px}
.pkr b{font-size:14.5px;font-weight:600}.pkf{width:36px;height:36px;font-size:19px;color:var(--m)}.pkf.on{color:#E9BC4C}
#rec{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(var(--bgr),.8);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);overflow-y:auto}
#rec.on{display:flex;animation:obin .7s var(--ease)}.recm{display:flex;justify-content:center;animation:lvpop 1s var(--sp) both}
/* variantes */
.mvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mvt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:20px;text-align:left;transition:transform .45s var(--sp)}.mvt:active{transform:scale(.96)}
.mvt .exi{width:52px;height:52px;flex:none;margin-bottom:6px}.mvt b{font-size:14px;font-weight:600;line-height:1.25}.mvt span{font-size:11.5px;color:var(--m)}
.vrh{width:200px;height:180px;margin-top:4px}.vrn{text-align:center;font-size:22px;font-weight:700;letter-spacing:-.02em;margin:14px 8px 8px;animation:obin .4s var(--ease)}
.vrq{text-align:center}.vrc{display:flex;flex-wrap:wrap;gap:8px}.vrc .obc{flex:1 1 auto;min-width:30%;padding:12px 14px;text-align:center}.vrc .obc small{font-size:10.5px}
.mtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:26px -16px 0;padding:0 16px 2px}.mtabs::-webkit-scrollbar{display:none}.mtabs .pill{font-size:13px;padding:8px 14px;white-space:nowrap}
.mcar{margin-top:-10px}.mcar .slide{flex-basis:90%;align-self:stretch}.mch{font-size:15px;font-weight:600;margin:0 2px 12px}
.mcar .b3c{height:300px}
.mcar #tmc,.mcar #muc{flex:1;display:flex;flex-direction:column;justify-content:center}
@media (min-width:760px){.mtabs{display:none}.mcar{margin-top:18px}}
/* musique */
.spc{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 4px;isolation:isolate}
.spbg{position:absolute;inset:-30px -20px 20px;z-index:-1;background-size:cover;background-position:center;filter:blur(38px) saturate(150%);opacity:.45;border-radius:40px}
.spart{display:block;width:min(200px,58%);aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 24px 50px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(var(--fgr),.12);transition:transform .5s var(--sp)}.spart:active{transform:scale(.96)}
.spimg{width:100%;height:100%;object-fit:cover;display:block}
.spph{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(145deg,rgba(var(--fgr),.2),rgba(var(--fgr),.05));color:var(--t);font-size:20px}.spph svg{width:42%;height:42%;stroke-width:1.4}
.spt{margin:14px 6px 12px;min-width:0;max-width:100%}.spt b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spt span{font-size:12.5px;color:var(--m)}
.sppl{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:#1DB954;color:#06130A;font-weight:700;font-size:14.5px;text-decoration:none;box-shadow:0 12px 28px -10px rgba(29,185,84,.7);transition:transform .45s var(--sp)}.sppl:active{transform:scale(.95)}
.sppl svg{width:18px;height:18px;fill:currentColor;stroke:none}
.spl{margin-top:16px;border-top:1px solid var(--l)}
.spr{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--l);cursor:pointer}.spr:last-child{border:0}
.spth{flex:0 0 40px;width:40px;height:40px;border-radius:9px;object-fit:cover;overflow:hidden}.spr b{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spr button{width:30px;height:30px;border-radius:50%;color:var(--m);font-size:12px;flex:none}.spr.on b{color:#1DB954}.spnew b{color:var(--m);font-weight:500}
.spon{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}.spon i{width:3px;border-radius:2px;background:#1DB954;animation:spon 1s ease-in-out infinite}.spon i:nth-child(2){animation-delay:-.35s}.spon i:nth-child(3){animation-delay:-.7s}
@keyframes spon{0%,100%{height:4px}50%{height:14px}}
.spprev{display:block;margin:10px auto 0;font-size:12.5px;color:var(--m);padding:6px 10px}
#spadd{margin-top:10px}
/* appareils */
.hdr{display:flex;justify-content:space-between;align-items:center}.hdt{margin-top:12px;min-width:0}
#hd{display:block}
#hd.sc .hdt{position:absolute;left:calc(var(--hp,20px) + 58px);right:calc(var(--hp,20px) + 112px);top:calc(env(safe-area-inset-top,0px) + 14px);height:44px;margin:0;display:flex;flex-direction:column;justify-content:center}
#hd.sc .hdt .sub{display:none}#hd.sc .hdt h1{max-width:100%}
#hd.sc h1{font-size:19px}
.dvb svg{width:21px;height:21px}
.dwslot{margin-top:6px}
.dw{width:100%;display:flex;gap:4px;justify-content:space-around;padding:14px 10px 12px;border-radius:26px}
.dwc{display:flex;flex-direction:column;align-items:center;min-width:0;flex:1;max-width:96px}
.dwc b{font-size:13.5px;font-weight:650;margin-top:7px;font-variant-numeric:tabular-nums}.dwc span{font-size:11px;color:var(--m);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dwr{position:relative;display:grid;place-items:center;flex:none}.dwr>svg:first-child{position:absolute;inset:0}
.dwa{animation:dwa 1.3s var(--ease) both}@keyframes dwa{from{stroke-dashoffset:var(--c)}}
.dwi{color:var(--t);stroke-width:1.5}
.dwz{position:absolute;right:-2px;bottom:-2px;font-style:normal;font-size:13px}
.dwl{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.dvg{display:grid;gap:12px}
.dvk{padding:16px;border-radius:24px}.dvkh{display:flex;align-items:center;gap:16px}.dvkh b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvp{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.dvbt{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dvbt .pill{padding:9px 14px;font-size:13px}
.dvty{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dvty button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:16px;font-size:10.5px;color:var(--m);transition:transform .4s var(--sp)}
.dvty button.on{box-shadow:inset 0 0 0 1.5px var(--t);color:var(--t)}.dvty svg{width:22px;height:22px;color:var(--t)}
.dvrange{width:100%;accent-color:var(--t)}
@media (min-width:760px){#hd{--hp:4px}.dw{justify-content:flex-start;gap:28px;padding:16px 22px}.dwc{flex:0 0 auto}.dvg{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
/* mascotte */
#pet{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:9;width:96px;transition:opacity .5s var(--ease),transform .6s var(--sp),bottom .6s var(--sp)}
body.open #pet,body.obo #pet{opacity:0;pointer-events:none;transform:translateY(20px)}
body.tab-data #pet{bottom:calc(env(safe-area-inset-bottom,0px) + 134px)}
.petc{display:block;width:96px;padding:0;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
body.light .petc{filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}
.pbob{transform-origin:50% 100%}
.petsvg{display:block;width:100%;height:auto;overflow:visible;stroke:none;stroke-width:0}
/* les animaux */
.an-cat{--pf:#E8E9ED;--p2:#E8A0A8;--p3:#fff;--pd:#141518}
body.light .an-cat{--pf:#2B2D33;--pd:#F3F4F6}
.an-dog{--pf:#D8B48A;--p2:#B98D5F;--p3:#F1E1CB;--pd:#2A1E14}
.an-shark{--pf:#8DA2BA;--p2:#EEF2F6;--p3:#fff;--pd:#1C2530}
.pfur{fill:var(--pf)}.pp2{fill:var(--p2)}.pp3{fill:var(--p3)}.pear{fill:#E8A0A8;opacity:.7}.ptl{stroke:var(--pf)}
.psh{fill:rgba(0,0,0,.35)}body.light .psh{fill:rgba(0,0,0,.14)}
.peye,.pnose{fill:var(--pd)}.pglint{fill:#fff;opacity:.85}body.light .an-cat .pglint{fill:#2B2D33}
.pmouth path,.pfrown,.pclosed path,.phappy path,.psadeyes path{stroke:var(--pd)}.pmouth .pteeth{fill:#fff;stroke:none}
.pwh path{stroke:var(--pd);opacity:.35}.pgill path{stroke:var(--pd);opacity:.3}.ptongue{fill:#E77F8E}
.pyawn{fill:var(--pd)}.pblush ellipse{fill:#F2A2A2;opacity:.55}.pzz text{fill:var(--t);font-size:11px;font-weight:700;opacity:0}.psweat path{fill:#8FB8FF}
.sx-hero .peye{fill:#141518}.sx-hero .pglint{fill:#fff}
.hood .pears{display:none}.hashat .pfin{display:none}
.pclosed,.phappy,.psadeyes,.pfrown,.pyawn,.pzz,.psweat,.pblush,.ptongue,.ptoy{opacity:0;transition:opacity .4s}
.peyes,.pmouth{transition:opacity .3s}
.ptoy{pointer-events:none}.tbu circle{fill:rgba(150,200,245,.18);stroke:rgba(170,215,255,.9);stroke-width:1.2}
/* animations de base */
.ptail{transform-origin:88px 86px;animation:ptail 3s ease-in-out infinite}@keyframes ptail{50%{transform:rotate(14deg)}}
.an-dog .ptail{transform-origin:88px 84px;animation-duration:1.1s}
.an-shark .ptail{transform-origin:88px 84px;animation:ptails 2.4s ease-in-out infinite}@keyframes ptails{50%{transform:rotate(-9deg)}}
.pbody{transform-origin:62px 96px;animation:pbr 3.6s ease-in-out infinite}@keyframes pbr{50%{transform:scaleY(1.04)}}
.phead{transform-origin:58px 72px;transition:transform .6s var(--sp)}
.peyes{transform-origin:58px 47px;animation:pblink 5s infinite}@keyframes pblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.plook{transition:transform .45s var(--ease)}
.pearl{transform-origin:32px 30px}.pearr{transform-origin:84px 30px}.pearl,.pearr{transition:transform .5s var(--sp)}
.pglow{animation:pglow 2s ease-in-out infinite}@keyframes pglow{50%{opacity:.45}}
.pwing{transform-origin:72px 66px;animation:pwing .18s ease-in-out infinite alternate}@keyframes pwing{to{transform:scaleY(.82) rotate(-4deg)}}
.pcape{transform-origin:62px 66px;animation:pcape 3.4s ease-in-out infinite}@keyframes pcape{50%{transform:skewX(-4deg)}}
.phalo{animation:phalo 3s ease-in-out infinite}@keyframes phalo{50%{transform:translateY(-3px)}}
/* dort */
.pm-sleep .peyes{opacity:0}.pm-sleep .pclosed,.pm-sleep .pzz{opacity:1}.pm-sleep .pmouth{opacity:.4}
.pm-sleep .phead{transform:translateY(8px) rotate(-8deg)}.pm-sleep .pbody{animation-duration:5.5s}.pm-sleep .ptail{animation:none}
.pm-sleep .pzz text{animation:pzz 3s infinite}.pm-sleep .pzz text:nth-child(2){animation-delay:.6s}.pm-sleep .pzz text:nth-child(3){animation-delay:1.2s}
@keyframes pzz{0%{opacity:0;transform:translateY(6px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
/* content */
.pm-happy .pbob{animation:phop .55s var(--ease) 3}@keyframes phop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-22%) scale(.95,1.06)}85%{transform:translateY(0) scale(1.06,.94)}}
.pm-happy .peyes,.pt-head .peyes,.pt-belly .peyes{opacity:0}.pm-happy .phappy,.pt-head .phappy,.pt-belly .phappy{opacity:1}
.pm-happy .pblush,.pt-head .pblush,.pt-belly .pblush{opacity:1}.pm-happy .ptail,.pt-head .ptail{animation-duration:.45s}
.pm-happy .ptongue,.pt-head .ptongue{opacity:1}.pm-happy .pearl,.pt-head .pearl{transform:rotate(-14deg)}.pm-happy .pearr,.pt-head .pearr{transform:rotate(14deg)}
/* triste */
.pm-sad .peyes{opacity:0}.pm-sad .psadeyes,.pm-sad .pfrown{opacity:1}.pm-sad .pmouth{opacity:0}
.pm-sad .phead{transform:translateY(5px) rotate(4deg)}.pm-sad .ptail{animation:none;transform:rotate(-30deg)}.pm-sad .pbob{filter:saturate(.6) brightness(.85)}
.pm-sad .pearl{transform:rotate(10deg)}.pm-sad .pearr{transform:rotate(-10deg)}
/* fatigué */
.pm-tired .peyes{animation:none;transform:scaleY(.35)}.pm-tired .psweat{opacity:.9}.pm-tired .phead{transform:translateY(4px)}
.pm-tired .pyawn{transform-origin:58px 62px;animation:pyawn 7s infinite}@keyframes pyawn{0%,70%,100%{opacity:0;transform:scale(.3)}78%,88%{opacity:1;transform:scale(1)}}
/* réveil, caresse rapide */
.pm-wake .pbob{animation:phop .5s var(--ease)}.pm-wake .peyes{transform:scale(1.25);animation:none}
#pet.boop .petc{animation:pboop .45s var(--sp)}@keyframes pboop{40%{transform:scale(1.12,.88)}}
/* regard, jeu */
.look-l .plook{transform:translateX(-3px)}.look-r .plook{transform:translateX(3px)}
.play .ptoy{opacity:1}.play .plook{transform:translateX(-3px) translateY(2px)}.play .phead{transform:rotate(-7deg)}
.play .an-cat .tb{transform-box:fill-box;transform-origin:center;animation:proll 1.4s ease-in-out infinite}@keyframes proll{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(9px) rotate(200deg)}}
.play .an-cat .ppaws>:first-child,.play .an-dog .ppaws>:first-child{animation:pbat .7s ease-in-out infinite}@keyframes pbat{50%{transform:translate(-6px,-5px)}}
.play .an-dog .tb{animation:pbnc .7s cubic-bezier(.3,0,.7,1) infinite}@keyframes pbnc{50%{transform:translateY(-22px)}}
.play .an-shark .phead{transform:rotate(-4deg)}
.play .tbu circle{transform-box:fill-box;transform-origin:center;animation:pbub 1.8s ease-out infinite}.play .tbu circle:nth-child(2){animation-delay:.4s}.play .tbu circle:nth-child(3){animation-delay:.8s}.play .tbu circle:nth-child(4){animation-delay:1.2s}
@keyframes pbub{0%{opacity:0;transform:translateY(10px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.2)}}
/* caresses (page dédiée) */
.pt-head .phead{animation:prub 1.2s ease-in-out infinite}@keyframes prub{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(1px)}}
.pt-belly .pbob{animation:pwig .42s ease-in-out infinite}@keyframes pwig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.02,.98)}}
.pt-belly .pmouth{opacity:0}.pt-belly .pyawn{opacity:1;transform:scale(.6);transform-origin:58px 62px}.pt-belly .ppaws{transform:translateY(-5px);transition:transform .3s var(--sp)}.pt-belly .ptail{animation-duration:.3s}
.eat .pmouth{opacity:0}.eat .pyawn{opacity:1;transform-origin:58px 62px;animation:pchomp .28s ease-in-out infinite}@keyframes pchomp{50%{transform:scale(.25)}}
/* bulle */
.petb{position:absolute;right:4px;bottom:92px;width:max-content;max-width:min(240px,calc(100vw - 40px));padding:10px 14px;border-radius:18px 18px 6px 18px;font-size:13px;line-height:1.4;color:var(--t);
  background:rgba(var(--bgr),.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--l);box-shadow:0 14px 30px -10px rgba(0,0,0,.5);
  opacity:0;transform:translateY(8px) scale(.92);transform-origin:bottom right;pointer-events:none;transition:opacity .35s var(--ease),transform .5s var(--sp)}
.petb.on{opacity:1;transform:none}
/* page dédiée */
.prname{flex:1;min-width:0;font:inherit;font-size:30px;font-weight:700;letter-spacing:-.02em;background:none;border:0;color:var(--t);outline:none;padding:0}
.prstage{position:relative;height:310px;margin:4px -8px 0;display:flex;align-items:flex-end;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.prstage .pbob{position:relative;width:min(300px,76vw)}
.prglow{position:absolute;left:50%;bottom:0;width:320px;height:320px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(var(--fgr),.11),transparent 62%);pointer-events:none}
.prb{position:absolute;left:50%;top:2px;z-index:2;width:max-content;max-width:86%;padding:10px 16px;border-radius:18px;font-size:14px;line-height:1.4;text-align:center;color:var(--t);
  background:rgba(var(--fgr),.1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--l);box-shadow:0 14px 30px -12px rgba(0,0,0,.5);
  opacity:0;transform:translate(-50%,8px) scale(.94);pointer-events:none;transition:opacity .35s var(--ease),transform .5s var(--sp)}
.prb.on{opacity:1;transform:translate(-50%,0)}
.prhint{text-align:center;margin-top:6px}
#prfx{position:absolute;inset:0;pointer-events:none}
.prh{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;color:#F27A93;animation:prh 1.4s var(--ease) forwards}
.prh svg{width:100%;height:100%;fill:currentColor;stroke:none;filter:drop-shadow(0 4px 8px rgba(242,122,147,.45))}
@keyframes prh{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(var(--s))}100%{opacity:0;transform:translate(var(--dx),-90px) scale(var(--s))}}
.prtr{position:absolute;left:calc(50% - 22px);top:10px;font-size:34px;font-style:normal;animation:prtr 1s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes prtr{0%{opacity:0;transform:translateY(-20px) rotate(-20deg)}20%{opacity:1}100%{opacity:.2;transform:translateY(175px) scale(.4) rotate(30deg)}}

function badge(c,t){return '<span class="bd '+(c||'nt')+'"><i></i>'+t+'</span>'}
function goal(v,t){return v==null?'':v>=t?'ok':v<t*.8?'ko':''}
function FG(){return document.body.classList.contains('light')?'#16171B':'#FFFFFF'}
function ringCol(c){return c==='ok'?OK:c==='ko'?KO:FG()}
function pn(x){if(typeof x==='number'){return x}var v=parseFloat(String(x).replace(/[\s  ]/g,'').replace(',','.'));return isFinite(v)?v:null}
function toKey(x){x=String(x);var m=x.match(/^(\d{4}-\d{2}-\d{2})/);if(m){return m[1]}m=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):''}
function fdate(t){return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}

/* Tendance linéaire sur les pesées (kg par jour) */
function trend(ws){
  var pts=ws.slice().reverse().map(function(x){return[Date.parse(x.d)/864e5,x.v]});
  if(pts.length<3){return null}
  var n=pts.length,mx=0,my=0,a=0,b=0;
  pts.forEach(function(p){mx+=p[0];my+=p[1]});mx/=n;my/=n;
  pts.forEach(function(p){a+=(p[0]-mx)*(p[1]-my);b+=(p[0]-mx)*(p[0]-mx)});
  if(!b){return null}
  var sl=a/b;return{slope:sl,lastDay:pts[n-1][0],fit:my+sl*(pts[n-1][0]-mx)};
}

/* Courbe premium en SVG */
function lineChart(pts,target,unit,col){
  if(pts.length<2){return '<div class="note" style="margin:8px 0">La courbe apparaîtra dès le 2ᵉ point.</div>'}
  var W=320,H=160,P=16,id='lg'+(GID++),vs=pts.map(function(p){return p.v});if(target!=null){vs.push(target)}
  var mn=Math.min.apply(null,vs),mxv=Math.max.apply(null,vs),pad=(mxv-mn)*.18||1;mn-=pad;mxv+=pad;col=col||FG();
  function X(i){return P+i*(W-2*P)/(pts.length-1)}function Y(v){return H-P-(v-mn)/(mxv-mn)*(H-2*P)}
  var d=pts.map(function(p,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ');
  var h='<svg class="ln" viewBox="0 0 '+W+' '+(H+22)+'"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  h+='<path d="'+d+' L'+X(pts.length-1).toFixed(1)+' '+(H-P)+' L'+X(0).toFixed(1)+' '+(H-P)+' Z" fill="url(#'+id+')" stroke="none"/>';
  if(target!=null){var ty=Y(target).toFixed(1);h+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+ty+'" y2="'+ty+'" stroke="'+OK+'" stroke-width="1.2" stroke-dasharray="4 5" opacity=".8"/><text x="'+(W-P)+'" y="'+(ty-6)+'" fill="'+OK+'" font-size="10.5" text-anchor="end">objectif '+f(target,1)+' '+unit+'</text>'}
  h+='<path class="dr" d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){var lst=i===pts.length-1;h+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(lst?4.5:2.6)+'" style="fill:'+(lst?col:'var(--bg)')+'" stroke="'+col+'" stroke-width="1.6"/>'});
  h+='<text x="'+P+'" y="'+(H+16)+'" class="ax" font-size="10.5">'+pts[0].l+'</text><text x="'+(W-P)+'" y="'+(H+16)+'" class="ax" font-size="10.5" text-anchor="end">'+pts[pts.length-1].l+'</text>';
  return h+'</svg>';
}

/* Score de forme du jour : sommeil de la dernière nuit + FC repos vs ta base */
function formScore(){
  var w=D.week,ls=last(w.sleep),lr=last(w.rhr),base=(D.reports.yearAgg&&D.reports.yearAgg.rhr)||avg(w.rhr),sc=[],ss=null,rs=null;
  if(ls!=null&&ls<=12){ss=ls>=8?100:ls>=7?85+(ls-7)*15:Math.max(0,85-(7-ls)*25);sc.push(ss)}
  if(lr!=null&&base){var dd=lr-base;rs=dd<=-2?100:dd<=0?90+(-dd)*5:Math.max(0,90-dd*12);sc.push(rs)}
  var v=sc.length?Math.round(avg(sc)):null;
  return{v:v,ls:ls,lr:lr,base:base,ss:ss,rs:rs,c:v==null?'nt':v>=80?'ok':v>=60?'nt':'ko',t:v==null?'Pas assez de données':v>=80?'Prêt à pousser':v>=60?'Séance normale':'Lève le pied'};
}

function alerts(){
  var w=D.week,t=D.targets,a=[],sl=avg(w.sleep),so=avg(w.sodium),pr=avg(w.prot),wa=avg(w.water),tr=trend(D.weights);
  if(w.sleep.some(function(x){return x!=null&&x>12})){a.push(['ko','Une nuit dépasse 12 h : import en double probable, vérifie l’onglet Sleep.'])}
  if(sl!=null&&sl<t.sleep){a.push(['ko','Sommeil moyen '+hm(sl)+', sous ton minimum de '+f(t.sleep)+' h.'])}
  if(so!=null&&so>t.sodium){a.push(['ko','Sodium '+f(so)+' mg/jour, au-dessus du plafond de '+f(t.sodium)+' mg.'])}
  if(pr!=null&&pr<t.prot*.9){a.push(['ko','Protéines '+f(pr)+' g/jour, sous ta cible de '+f(t.prot)+' g.'])}
  if(wa!=null&&wa<t.water*.75){a.push(['ko','Hydratation '+f(wa,1)+' L/jour, loin des '+f(t.water,1)+' L.'])}
  var z=w.muscles.filter(function(m){return m.s===0}).map(function(m){return m.n});
  if(z.length){a.push(['ko',z.join(', ')+' : aucune série cette semaine.'])}
  if(tr&&tr.slope<-0.01){a.push(['ok','Poids en baisse : '+f(tr.slope*7,1)+' kg par semaine.'])}
  if(pr!=null&&pr>=t.prot){a.push(['ok','Protéines au-dessus de ta cible ('+f(pr)+' g/jour).'])}
  if(so!=null&&so<=t.sodium){a.push(['ok','Sodium sous le plafond ('+f(so)+' mg/jour).'])}
  if(sl!=null&&sl>=t.sleep&&sl<=12){a.push(['ok','Sommeil moyen au-dessus de '+f(t.sleep)+' h.'])}
  return a;
}

function liftHist(v,name){
  var hd=(v[0]||[]).map(function(c){return String(c).toLowerCase()});

  var cD=ci(/^date/),cE=ci(/exercice/),cC=ci(/charge/),cR=ci(/r[ée]p[ée]tition|reps/),cI=ci(/^rir/),by={},nm=name.toLowerCase().trim();
  if(cD<0||cE<0||cC<0||cR<0){return[]}
  v.slice(1).forEach(function(r){
    if(String(r[cE]).toLowerCase().trim()!==nm){return}
    var L=pn(r[cC]),R=pn(r[cR]),d=toKey(r[cD]);if(!L||!R||!d){return}
    var e=L*(1+R/30);if(!by[d]||e>by[d].e){by[d]={e:e,L:L,R:R,rir:cI>=0?pn(r[cI]):null}}
  });
  return Object.keys(by).sort().map(function(d){return{d:d,v:by[d].e,L:by[d].L,R:by[d].R,rir:by[d].rir}});

function gridCards(rows){
  var h='',hdr=null,k=0;
  rows.forEach(function(r,i){
    var ne=r.filter(function(c){return c!==''});
    if(ne.length===1&&!isNum(ne[0])){h+='<div class="st">'+esc(ne[0])+'</div>';hdr=null;return}
    var nx=rows[i+1];
    if(!hasVal(r)){
      if(nx&&nx.filter(function(c){return c!==''}).length>1&&hasVal(nx)){hdr=r;return}
      h+='<div class="nl">'+ne.map(esc).join(' · ')+'</div>';return}
    var lab=hdr||r.map(function(){return ''});

}

function dvSave(){try{localStorage.setItem('forme_devs',JSON.stringify(DEVS))}catch(e){}}
function dvById(id){for(var i=0;i<DEVS.length;i++){if(DEVS[i].id===id){return DEVS[i]}}return null}
/* niveau : {p:%, live:bool, chg:bool, t:quand} ou null */
function dvLevel(d){
  var L=DVL[d.id];if(L&&L.p!=null){return L}
  if(d.base!=null&&d.bt){var days=+d.days||DVT[d.type].days,p=d.base-(Date.now()-d.bt)/(days*864e5)*100;return{p:Math.max(0,Math.round(p)),live:false,t:d.bt}}
  return null;
}
function dvCol(p){return p==null?'rgba(var(--fgr),.18)':p>=50?'var(--ok)':p>=20?'#E9BC4C':'var(--ko)'}
function dvRing(d,S){
  var L=dvLevel(d),p=L?L.p:null,R=S/2-5,C=2*Math.PI*R,sw=S>80?6:4.5;
  return '<div class="dwr" style="width:'+S+'px;height:'+S+'px"><svg viewBox="0 0 '+S+' '+S+'" style="width:'+S+'px;height:'+S+'px">'+
   '<circle cx="'+S/2+'" cy="'+S/2+'" r="'+R+'" fill="none" stroke="rgba(var(--fgr),.1)" stroke-width="'+sw+'"'+(p==null?' stroke-dasharray="2 5"':'')+'/>'+
   (p!=null?'<circle class="dwa" cx="'+S/2+'" cy="'+S/2+'" r="'+R+'" fill="none" stroke="'+dvCol(p)+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-p/100)).toFixed(1)+'" transform="rotate(-90 '+S/2+' '+S/2+')" style="--c:'+C.toFixed(1)+'"/>':'')+
   '</svg><svg class="dwi" viewBox="0 0 24 24" style="width:'+Math.round(S*.4)+'px;height:'+Math.round(S*.4)+'px">'+DVT[d.type].ic+'</svg>'+
   (L&&L.chg?'<em class="dwz">⚡</em>':'')+(L&&L.live?'<i class="dwl"></i>':'')+'</div>';
}
function dvPct(d){var L=dvLevel(d);return L?(L.live?'':'≈ ')+L.p+' %':'—'}
function dvWidget(){
  if(!DEVS){dvLoad()}if(!DEVS.length){return ''}
  return '<button class="g dw tap" onclick="openDevices()" aria-label="Mes appareils">'+DEVS.slice(0,6).map(function(d){
    return '<div class="dwc">'+dvRing(d,58)+'<b>'+dvPct(d)+'</b><span>'+esc(d.name)+'</span></div>'}).join('')+'</button>';
}
function dvPaint(){[].forEach.call(document.querySelectorAll('.dwslot'),function(s){s.innerHTML=dvWidget()});if(document.body.classList.contains('open')&&$('#dvp')&&!DVE){dvPage()}}
function dvAgo(t){var h=(Date.now()-t)/36e5;return h<1?'à l’instant':h<24?'il y a '+Math.round(h)+' h':'il y a '+Math.round(h/24)+' j'}
function dvStatus(d){
  var L=dvLevel(d);
  if(d.auto==='phone'){return L?(L.chg?'En charge · en direct':'En direct'):'Niveau non disponible sur ce navigateur'}
  if(DVL[d.id]&&DVL[d.id].p!=null){return 'En direct en Bluetooth'}
  if(L){return 'Estimé · chargé '+dvAgo(d.bt)+(d.base<100?' (à '+d.base+' %)':'')}
  return 'Touche « Rechargé » à la prochaine charge'
}

function dvType(b,k){[].forEach.call(b.parentNode.children,function(x){x.classList.toggle('on',x===b)});$('#dve_t').value=k;var dd=$('#dve_d');if(dd&&$('#dve_n').value===''){dd.value=DVT[k].days}}
function dvSaveEd(id){
  var t=$('#dve_t').value,n=$('#dve_n').value.trim()||DVT[t].n,dd=$('#dve_d'),pp=$('#dve_p');
  var d=id==='new'?{id:'d'+Date.now().toString(36)}:dvById(id);if(!d){return}
  d.type=t;d.name=n;if(dd){d.days=Math.max(.2,pn(dd.value)||DVT[t].days)}
  if(pp){var L=dvLevel(d),v=+pp.value;if(!L||Math.abs(L.p-v)>=1||id==='new'){d.base=v;d.bt=Date.now()}}
  if(id==='new'){DEVS.push(d)}dvSave();DVE=null;dvPage();dvPaint();toast('Appareil enregistré');
}
function dvDel(id){DEVS=DEVS.filter(function(d){return d.id!==id});delete DVL[id];dvSave();DVE=null;dvPage();dvPaint()}
function dvCharged(id){var d=dvById(id);if(!d){return}d.base=100;d.bt=Date.now();dvSave();dvPage();dvPaint();toast('🔋 '+d.name+' rechargé');if(navigator.vibrate){navigator.vibrate(10)}}
/* batterie du téléphone, en direct */
function dvPhone(){
  if(!navigator.getBattery){return}navigator.getBattery().then(function(b){
    function up(){DEVS.forEach(function(d){if(d.auto==='phone'){DVL[d.id]={p:Math.round(b.level*100),live:true,chg:b.charging,t:Date.now()}}});dvPaint()}
    up();b.addEventListener('levelchange',up);b.addEventListener('chargingchange',up);
  }).catch(function(){});
}
/* Bluetooth standard (service batterie) */
function dvBleRead(d,dev){
  return dev.gatt.connect().then(function(s){return s.getPrimaryService('battery_service')}).then(function(s){return s.getCharacteristic('battery_level')})
   .then(function(c){function set(v){DVL[d.id]={p:v.getUint8(0),live:true,t:Date.now()};d.base=DVL[d.id].p;d.bt=Date.now();dvSave();dvPaint()}
     c.addEventListener('characteristicvaluechanged',function(e){set(e.target.value)});return c.readValue().then(set).then(function(){return c.startNotifications().catch(function(){})})});
}
function dvBle(id){
  var d=dvById(id);if(!d||!navigator.bluetooth){toast('Bluetooth indisponible : ouvre Forme depuis Chrome');return}
  navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service']}).then(function(dev){
    d.ble=dev.id;dvSave();dev.addEventListener('gattserverdisconnected',function(){delete DVL[d.id];dvPaint()});
    return dvBleRead(d,dev).then(function(){toast('🔋 '+d.name+' : batterie en direct')});
  }).catch(function(e){if(e&&e.name==='NotFoundError'&&/cancel/i.test(e.message||'')){return}
    if(e&&e.name==='NotFoundError'){toast('Pas de batterie partagée : on garde l’estimation')}else if(e){toast('Connexion impossible')}});
}
function dvBleAuto(){
  if(!navigator.bluetooth||!navigator.bluetooth.getDevices){return}
  navigator.bluetooth.getDevices().then(function(list){list.forEach(function(dev){var d=DEVS.filter(function(x){return x.ble===dev.id})[0];if(d){dvBleRead(d,dev).catch(function(){})}})}).catch(function(){});
}

var PROF=null;try{PROF=JSON.parse(localStorage.getItem('forme_profile')||'null')}catch(e){PROF=null}
var PF=[['prenom','Prénom'],['sexe','Sexe'],['age','Âge'],['taille','Taille (cm)'],['poids','Poids de départ (kg)'],['objectif','Objectif'],['experience','Expérience en musculation'],['seances','Séances par semaine'],['sommeil','Sommeil habituel'],['activite','Activité au quotidien'],['alimentation','Alimentation'],['eau','Eau bue par jour'],['c_poids','Cible poids (kg)'],['c_prot','Cible protéines (g/jour)'],['c_eau','Cible eau (L/jour)'],['c_sommeil','Cible sommeil (h/nuit)'],['c_kcal','Cible calories (kcal/jour)'],['maj','Mis à jour le']];
var OPT={sexe:{h:'Homme',f:'Femme'},objectif:{seche:'Perdre du gras',masse:'Prendre du muscle',recompo:'Les deux',forme:'Être en forme'},
  experience:{'0':'Jamais','1':'Moins d’un an','2':'1 à 3 ans','3':'Plus de 3 ans'},sommeil:{'<6':'Moins de 6 h','6-7':'6 à 7 h','7-8':'7 à 8 h','8+':'8 h et plus'},
  activite:{assis:'Plutôt assis',debout:'Plutôt debout',physique:'Physique'},alimentation:{feeling:'Au feeling',equilibre:'Plutôt équilibrée',compte:'Je compte tout'},eau:{'<1':'Moins d’1 L','1-2':'1 à 2 L','2-3':'2 à 3 L','3+':'3 L et plus'}};
var OB={step:0,p:{}};
function profSave(){try{localStorage.setItem('forme_profile',JSON.stringify(PROF))}catch(e){}}
function profRows(){return PF.map(function(k){var v=PROF[k[0]];v=v==null?'':OPT[k[0]]&&OPT[k[0]][v]?OPT[k[0]][v]:String(v);return[k[0],k[1],v]})}
function profPush(){if(!PROF||!live()||gs()){return Promise.resolve(false)}return call('profil',null,{data:JSON.stringify(profRows())}).then(function(){return true}).catch(function(){return false})}
function profFromRows(v){
  var p={done:1},rev={};Object.keys(OPT).forEach(function(k){rev[k]={};Object.keys(OPT[k]).forEach(function(c){rev[k][OPT[k][c]]=c})});
  (v||[]).slice(1).forEach(function(r){var k=String(r[0]||'').trim(),val=String(r[2]==null?'':r[2]).trim();if(!k){return}p[k]=rev[k]&&rev[k][val]!=null?rev[k][val]:val});
  return p.prenom||p.poids?p:null;
}

function applyProfile(){
  if(!D||!PROF){return}var t=D.targets,n=function(x){var v=pn(x);return v!=null&&v>0?v:null};
  t.weight=n(PROF.c_poids)||t.weight;t.prot=n(PROF.c_prot)||t.prot;t.water=n(PROF.c_eau)||t.water;t.sleep=n(PROF.c_sommeil)||t.sleep;t.kcal=n(PROF.c_kcal)||t.kcal;
}
function r5(x,s){return Math.round(x/s)*s}
function propose(p){
  var w=pn(p.poids)||75,h=pn(p.taille)||175,a=pn(p.age)||25,se=pn(p.seances)||3;
  var bmr=10*w+6.25*h-5*a+(p.sexe==='f'?-161:5),act=({assis:1.3,debout:1.45,physique:1.6}[p.activite]||1.4)+Math.min(7,se)*.035;
  var kcal=r5(bmr*act*({seche:.82,masse:1.08,recompo:.95,forme:1}[p.objectif]||1),50);
  var prot=r5(w*({seche:2,masse:1.8,recompo:2,forme:1.6}[p.objectif]||1.8),5);
  var eau=Math.max(2,r5(w*.035+se*.1,.25)),som=a<26?8:7.5;

var SEH=null;
function seriesName(){var s=SL&&SL.filter(function(x){return /^s[ée]ries$/i.test(x.name.trim())})[0];return s?s.name:null}
function loadHist(cb){
  var got={},mn=sheetName(/muscu/i,'Musculation'),sn=seriesName();
  function done(){if('m' in got&&'s' in got){SEH=buildHist(got.m,got.s);cb&&cb(SEH)}}
  getRaw(mn,function(v){got.m=v||null;done()});
  if(sn){getRaw(sn,function(v){got.s=v||null;done()})}else{got.s=LOCALSER.length?[['Date','Séance','Exercice','Groupe','Série','Charge (kg)','Répétitions','RIR','Repos (s)']].concat(LOCALSER):null;done()}
}
var LOCALSER=[];
function buildHist(m,s){
  var E={},names={};
  function ex(n,g){var k=n.toLowerCase().trim();if(!E[k]){E[k]={n:n,g:g||'',sessions:{},maxC:0,bestE:0,repsAt:[]}}if(g&&!E[k].g){E[k].g=g}names[k]=1;return E[k]}
  if(m&&m.length>1){var h=m[0],c={d:colIdx(h,/^date/),e:colIdx(h,/exercice/),g:colIdx(h,/groupe/),n:colIdx(h,/s[ée]ries eff/),r:colIdx(h,/r[ée]p/),L:colIdx(h,/charge/),i:colIdx(h,/^rir/),ca:colIdx(h,/cardio/),t:colIdx(h,/type de s|s[ée]ance/)};
    m.slice(1).forEach(function(x){var d=toKey(x[c.d]),n=String(x[c.e]||'').trim();if(!d||!n){return}var q=ex(n,c.g>=0?String(x[c.g]||''):''),ns=pn(x[c.n])||0,R=pn(x[c.r]),L=pn(x[c.L]),I=c.i>=0?pn(x[c.i]):null,ca=c.ca>=0?pn(x[c.ca]):null;
      var S=q.sessions[d]=q.sessions[d]||{sets:[],agg:true,min:0,name:c.t>=0?String(x[c.t]||''):''};
      if(ca){S.min+=ca}
      if(ns>0&&R){for(var j=0;j<ns;j++){S.sets.push({c:L||0,r:R,i:I})}}
      if(L&&R){q.maxC=Math.max(q.maxC,L);q.bestE=Math.max(q.bestE,L*(1+R/30));q.repsAt.push([L,R])}});}
  if(s&&s.length>1){var h2=s[0],c2={d:colIdx(h2,/^date/),e:colIdx(h2,/exercice/),g:colIdx(h2,/groupe/),L:colIdx(h2,/charge/),r:colIdx(h2,/r[ée]p/),i:colIdx(h2,/^rir/),p:colIdx(h2,/repos/)},seen={};
    s.slice(1).forEach(function(x){var d=toKey(x[c2.d]),n=String(x[c2.e]||'').trim();if(!d||!n){return}var q=ex(n,c2.g>=0?String(x[c2.g]||''):''),key=d;
      if(!seen[n+d]){seen[n+d]=1;q.sessions[key]={sets:[],agg:false,min:(q.sessions[key]||{}).min||0}}
      var L=pn(x[c2.L])||0,R=pn(x[c2.r]),I=c2.i>=0?pn(x[c2.i]):null,P=c2.p>=0?pn(x[c2.p]):null;if(!R){return}
      q.sessions[key].sets.push({c:L,r:R,i:I,p:P});if(L){q.maxC=Math.max(q.maxC,L);q.bestE=Math.max(q.bestE,L*(1+R/30))}q.repsAt.push([L,R])});}
  var sesNames={};if(m&&m.length>1){var ht=colIdx(m[0],/type de s|s[ée]ance/);if(ht>=0){m.slice(1).forEach(function(x){var v=String(x[ht]||'').trim();if(v){sesNames[v]=(sesNames[v]||0)+1}})}}
  return{E:E,ses:Object.keys(sesNames).sort(function(a,b){return sesNames[b]-sesNames[a]}).slice(0,8)};
}
function histOf(n){return SEH&&SEH.E[n.toLowerCase().trim()]||null}
function lastSession(n){var q=histOf(n);if(!q){return null}var ks=Object.keys(q.sessions).sort();if(!ks.length){return null}var d=ks[ks.length-1];return{d:d,s:q.sessions[d]}}
function summSets(sets){
  if(!sets||!sets.length){return ''}var same=sets.every(function(x){return x.c===sets[0].c&&x.r===sets[0].r});
  if(same){return sets.length+' × '+f(sets[0].r,sets[0].r%1?1:0)+(sets[0].c?' à '+f(sets[0].c,sets[0].c%1?1:0)+' kg':'')}
  return sets.map(function(x){return (x.c?f(x.c,x.c%1?1:0)+'×':'')+f(x.r,x.r%1?1:0)}).join(' · ');
}

function rnd(x,d){var p=Math.pow(10,d||1);return Math.round(x*p)/p}
function seBuild(){
  var rows=[],sets=[],recs=[],ups=[];
  SE.ex.forEach(function(e){
    if(e.cardio){var mn=pn(e.min);if(mn>0){rows.push({seance:SE.name,groupe:e.g,exo:e.n,series:0,reps:0,charge:0,rir:'',tonnage:0,stim:0,cardio:mn,notes:''})}return}
    var S=e.sets.map(function(s){return{c:pn(s.c)||0,r:pn(s.r)||0,i:pn(s.i),p:parseRest(s.p)}}).filter(function(s){return s.r>0});if(!S.length){return}
    var ton=0,stim=0,ri=[],topC=0,bE=0;
    S.forEach(function(s,j){ton+=s.c*s.r;if(s.i!=null&&s.i<=2){stim++}if(s.i!=null){ri.push(s.i)}topC=Math.max(topC,s.c);var e1=s.c*(1+s.r/30);bE=Math.max(bE,e1);
      sets.push({seance:SE.name,exo:e.n,groupe:e.g,n:j+1,c:s.c,r:s.r,i:s.i==null?'':s.i,p:s.p==null?'':s.p,e1:s.c?rnd(e1,1):''})});
    var avgR=rnd(S.reduce(function(a,s){return a+s.r},0)/S.length,1),ri0=ri.length?rnd(avg(ri),1):'';
    rows.push({seance:SE.name,groupe:e.g,exo:e.n,series:S.length,reps:avgR,charge:topC,rir:ri0,tonnage:Math.round(ton),stim:stim,cardio:0,notes:''});
    var q=histOf(e.n),L=lastSession(e.n);
    if(!q||(!q.maxC&&!Object.keys(q.sessions).length)){recs.push({t:'b',e:e.n,txt:'Première fois au '+e.n.split(' (')[0].toLowerCase()+' 🎉'});return}
    if(topC>0&&topC>q.maxC+.01){recs.push({t:'o',e:e.n,txt:'Record de charge : '+f(topC,topC%1?1:0)+' kg',sub:q.maxC?'+'+f(topC-q.maxC,(topC-q.maxC)%1?1:0)+' kg sur ton ancien record':''});return}
    if(bE>q.bestE+.1&&topC>0){recs.push({t:'a',e:e.n,txt:'Nouveau 1RM estimé : '+f(bE,1)+' kg',sub:'+'+f(bE-q.bestE,1)+' kg'});return}
    var rp=null;S.forEach(function(s){if(!s.c){return}var prev=0;q.repsAt.forEach(function(a){if(a[0]>=s.c-.01){prev=Math.max(prev,a[1])}});if(s.r>prev&&prev>0&&(!rp||s.r-prev>rp.d)){rp={c:s.c,r:s.r,d:s.r-prev}}});
    if(rp){recs.push({t:'b',e:e.n,txt:'Record de répétitions : '+f(rp.r)+' × '+f(rp.c,rp.c%1?1:0)+' kg',sub:'+'+f(rp.d)+' rép.'});return}
    if(L&&L.s.sets.length){var lt=Math.max.apply(null,L.s.sets.map(function(x){return x.c||0}));if(topC>lt+.01){ups.push(e.n.split(' (')[0]+' : '+f(lt,lt%1?1:0)+' → '+f(topC,topC%1?1:0)+' kg')}}
  });

}

/* ---------- déblocages (niveau, trophée précis, nombre de trophées, platine) ---------- */
function petLvl(){try{return TRL.length?trXP().lvl:1}catch(e){return 1}}
function trDone(id){return TRL.some(function(t){return t.id===id&&t.done})}
function trCount(){return TRL.filter(function(t){return t.done}).length}
function unlocked(it){var u=it.u;if(u.free){return true}if(u.lvl){return petLvl()>=u.lvl}if(u.tr){return trDone(u.tr)}if(u.n){return trCount()>=u.n}if(u.plat){return TRL.some(function(t){return t.tier==='p'&&t.done})}return false}
function unlockTxt(it){var u=it.u;if(u.free){return 'Offert'}if(u.lvl){return 'Niveau '+u.lvl}
  if(u.tr){var t=byId(TRL,u.tr);return 'Trophée « '+(t?t.name:u.tr)+' »'}if(u.n){return u.n+' trophées'}if(u.plat){return 'Un trophée platine'}return ''}
function unlockHow(it){var u=it.u;if(u.lvl){return 'Atteins le niveau '+u.lvl+' (tu es niveau '+petLvl()+')'}
  if(u.tr){var t=byId(TRL,u.tr);return t?'Décroche « '+t.name+' » : '+t.desc.charAt(0).toLowerCase()+t.desc.slice(1):'Décroche le trophée'}
  if(u.n){return 'Décroche '+u.n+' trophées (tu en as '+trCount()+')'}if(u.plat){return 'Décroche n’importe quel trophée platine'}return ''}
function petUnKey(){return 'forme_petun_'+(typeof live==='function'&&live()?'live':'demo')}
function petCheckUnlocks(){
  if(!TRL.length){return}var k=petUnKey(),seen=null;try{seen=JSON.parse(localStorage.getItem(k)||'null')}catch(e){}
  var all=SUITS.concat(HATS).filter(unlocked).map(function(x){return x.id});
  if(seen){var nw=all.filter(function(id){return seen.indexOf(id)<0});
    if(nw.length&&PET.on){var it=byId(SUITS,nw[0])||byId(HATS,nw[0]);setTimeout(function(){toast('Nouveau pour '+petName()+' : '+it.n+' '+it.e);petCheer('Une nouvelle tenue ? Viens me la mettre ! '+it.e)},TRQ&&TRQ.length?6000:1200)}}
  try{localStorage.setItem(k,JSON.stringify(all))}catch(e){}
  if(PS.suit&&!unlocked(byId(SUITS,PS.suit)||{u:{}})){PS.suit='';psSave()}
  if(PS.hat&&!unlocked(byId(HATS,PS.hat)||{u:{}})){PS.hat='';psSave()}
}

/* ---------- petite mascotte flottante ---------- */
function petInit(){
  var el=$('#pet');
  if(!el){el=document.createElement('div');el.id='pet';document.body.appendChild(el)}
  el.innerHTML='<div class="petb" id="petb"></div><button class="petc" onclick="petTap()" aria-label="'+esc(petName())+', ta mascotte"><div class="pbob">'+petSvg()+'</div></button>';
  el.className='pm-'+PET.mood;el.style.display=PET.on?'':'none';petUpdate();
}
function petBase(){
  var h=new Date().getHours();if(h>=23||h<7){return 'sleep'}
  if(!D){return 'idle'}
  var S=formScore(),last=lastSeanceDays(),fat=lastFatigue(),ko=alerts().filter(function(a){return a[0]==='ko'}).length;
  if((S.v!=null&&S.v<60)||(fat&&fat<=2)){return 'tired'}
  if(ko>=3||(last!=null&&last>=5)||petJoy()<20){return 'sad'}
  if(Date.now()-PET.t>90000&&Math.random()<.35){return 'sleep'}
  return 'idle';
}
function lastSeanceDays(){var t=INS&&INS.train;if(!t||!t.length){return null}var l=t.slice().sort().pop();return Math.round((Date.parse(todayKey())-Date.parse(l))/864e5)}
function lastFatigue(){try{var d=JSON.parse(localStorage.getItem('forme_lastfat')||'null');return d&&d.d>=addDays(todayKey(),-1)?d.v:null}catch(e){return null}}
function petSetCls(el,m){if(!el){return}var keep=['play','boop','look-l','look-r','pt-head','pt-belly','eat'].filter(function(c){return el.classList.contains(c)});el.className='pm-'+m+(keep.length?' '+keep.join(' '):'')}
function petSet(m){PET.mood=m;petSetCls($('#pet'),m)}
function petUpdate(){if(!PET.on||PET.busy){return}petSet(petBase())}
function petJoy(){var h=(Date.now()-(PS.joyT||Date.now()))/36e5;return Math.max(5,Math.min(100,Math.round((PS.joy==null?70:PS.joy)-h*1.2)))}
function petJoyAdd(n){PS.joy=Math.min(100,petJoy()+n);PS.joyT=Date.now();psSave();var b=$('#prjoy');if(b){prJoyPaint()}}
function petCheer(msg){
  if(!PET.on){return}petJoyAdd(8);var el=$('#pet');if(!el){return}PET.busy=true;PET.t=Date.now();petSet('happy');
  if(msg){petSay(msg,3600)}var st=$('#prs');if(st){prMood('happy');if(msg){prSay(msg)}}
  setTimeout(function(){PET.busy=false;petUpdate();if($('#prs')){prMood(petBase()==='sleep'?'idle':petBase())}},3400);
}
function petSay(t,ms){var b=$('#petb');if(!b||!PET.on){return}b.innerHTML=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');clearTimeout(petSay.k);petSay.k=setTimeout(function(){b.classList.remove('on')},ms||4200)}
function petLines(){
  var n=uname().trim()||'toi',m=PET.mood,L=[],d=lastSeanceDays(),S=D?formScore():{},w=D?D.week:null,A=ANIM[PS.an];
  if(m==='sleep'){return['Zzz… 😴','Chut, je recharge mes batteries… comme toi cette nuit ?','Mmh… encore 5 minutes…']}
  if(d!=null&&d>=3){L.push('Ça fait '+d+' jours sans séance… on y retourne ensemble ? 🏋️')}
  if(m==='tired'){L.push('Toi aussi tu as l’air fatigué… séance légère aujourd’hui ? 🥱');if(S.ls){L.push('Seulement '+hm(S.ls)+' de sommeil… ce soir on se couche tôt, promis ?')}}
  if(m==='sad'){L.push(petJoy()<20?'Tu m’as un peu oublié… tu me fais un câlin ? 🥺':'Quelques points à surveiller cette semaine… on va arranger ça, '+n+' 💪')}
  if(w){var st=sum(w.stim);if(st>0){L.push(st+' séries stimulantes cette semaine, j’adore '+A.e)}}
  if(TRL&&TRL.length){var nx=TRL.filter(function(t){return !t.done&&!t.secret&&t.tier!=='p'}).sort(function(a,b){return b.cur/b.goal-a.cur/a.goal})[0];if(nx){L.push('Prochain trophée : « '+nx.name+' ». On le décroche ? 🏆')}
    var lk=SUITS.concat(HATS).filter(function(x){return !unlocked(x)})[0];if(lk){L.push('J’aimerais bien la tenue '+lk.n+' '+lk.e+'… '+unlockTxt(lk).toLowerCase()+' et elle est à moi !')}}
  L.push('Coucou '+n+' ! 👋','Bois un verre d’eau, ça fait toujours du bien 💧','Je crois en toi. Bon, je suis '+A.me+', mais quand même 🐾');
  return L;
}
function petTap(){
  var el=$('#pet');el.classList.remove('boop');void el.offsetWidth;el.classList.add('boop');if(navigator.vibrate){navigator.vibrate(10)}
  setTimeout(openPetRoom,260);
}

function petGreet(){
  if(!PET.on){return}var last=0;try{last=+localStorage.getItem('forme_petseen')||0;localStorage.setItem('forme_petseen',String(Date.now()))}catch(e){}
  petMeta();if(Date.now()-last<6*3600e3){return}
  setTimeout(function(){var d=lastSeanceDays(),n=uname().trim(),away=last?Math.floor((Date.now()-last)/864e5):0;
    if(away>=2){petSet('sad');petSay('Tu m’as manqué'+(n?' '+n:'')+'… '+away+' jours sans te voir 🥺 Touche-moi !')}
    else if(d!=null&&d>=3){petSet('sad');petSay('Tu m’as manqué'+(n?' '+n:'')+'… '+d+' jours sans séance 🥺')}
    else if(PET.mood==='sleep'){petSay('Zzz… (touche-moi pour me réveiller)')}
    else{petSay((new Date().getHours()<12?'Bonjour':'Re')+(n?' '+n:'')+' ! '+ANIM[PS.an].e+' Touche-moi pour jouer.')}},2500);
}

  var z=prZone(e);if(z!==PR.zone){PR.zone=z;prPetStart(z)}
  if(PR.d>34){PR.d=0;prHeart(e);if(navigator.vibrate){navigator.vibrate(6)}}

function petNotif(btn){
  if(PS.notif){PS.notif=false;psSave();if(btn){btn.classList.remove('on')}petMeta();prNote('Notifications coupées.');
    if('serviceWorker' in navigator){navigator.serviceWorker.ready.then(function(r){if(r.periodicSync){r.periodicSync.unregister('forme-pet')}}).catch(function(){})}return}
  if(!('Notification' in window)||!('serviceWorker' in navigator)||(typeof gs==='function'&&gs())){prNote('<span class="tko">Les notifications ne marchent que dans l’appli Forme installée sur ton écran d’accueil.</span>');return}

      return q.then(function(st){
        return reg.periodicSync.register('forme-pet',{minInterval:12*3600e3}).then(function(){prNote('Activées ✓ '+esc(petName())+' t’écrira s’il ne te voit pas pendant plus d’un jour (entre 9 h et 22 h).')})
          .catch(function(){prNote('Activées, mais ton téléphone bloque le réveil en arrière-plan'+(st.state!=='granted'?' : installe Forme sur l’écran d’accueil depuis Chrome':'')+'. '+esc(petName())+' te le dira à l’ouverture.')});

/* ---------- Connexion à ta feuille Google (lien /exec + code secret, gardés sur ce téléphone) ---------- */
var CFG=null,LAST=0;
try{CFG=JSON.parse(localStorage.getItem('forme_cfg')||'null')}catch(e){}
function live(){return !!(gs()||(CFG&&CFG.url&&CFG.key))}
function cache(){try{return JSON.parse(localStorage.getItem('forme_cache')||'null')}catch(e){return null}}
function call(api,name,qs){
  return new Promise(function(res,rej){
    if(gs()){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      if(api==='save'||api==='profil'){rej(new Error('Indisponible ici'));return}
      if(api==='dashboard'){r.getDashboardData()}else if(api==='list'){r.appListSheets()}else{r.appSheetData(name)}
      return;
    }
    if(!CFG){rej(new Error('Feuille non reliée'));return}
    var u=CFG.url+'?api='+api+'&key='+encodeURIComponent(CFG.key)+(name?'&name='+encodeURIComponent(name):'')+(qs?'&'+Object.keys(qs).map(function(k){return k+'='+encodeURIComponent(qs[k])}).join('&'):'')+'&t='+Date.now();
    fetch(u,{redirect:'follow'}).then(function(r){return r.text()}).then(function(t){
      var d;try{d=JSON.parse(t)}catch(e){throw new Error('Réponse inattendue : vérifie que le lien est bien celui de ton déploiement et que la nouvelle version est publiée.')}
      if(d&&d.error){throw new Error(d.error)}
      res(d);
    }).catch(function(e){
      rej(e instanceof TypeError?new Error('Lien injoignable : vérifie ta connexion, le lien, et que le déploiement est accessible à « Tout le monde ».'):e);
    });
  });
}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2800)}

}

  loadSheets();
  call('dashboard').then(function(d){
    demoMode=false;LAST=Date.now();
    try{localStorage.setItem('forme_cache',JSON.stringify({t:LAST,d:d}))}catch(e){}
    init(d);loadInsights();flushPending();loadMesSheet().then(function(){mergeWeights();renderWeek();if(TAB==='moi'){renderMoi()}});
    loadProfileSheet().then(function(){applyProfile();renderWeek();renderForce();setHead();paintAvatar();obCheck()});if(manual){toast('Données à jour')}
  }).catch(function(e){
    var c=cache();
    if(c){demoMode=false;if(!D){init(c.d)}toast('Hors ligne · données du '+new Date(c.t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}
    else{$('#v-week').innerHTML='<div class="g" style="margin-top:6px"><b>Impossible de charger tes données</b><div class="note" style="margin-top:6px">'+esc(e.message||e)+'</div><button class="g pill" style="margin-top:14px;width:100%;padding:12px" onclick="openSet()">Ouvrir les réglages</button></div>'}
  });
}

  var c=CFG||{};
  openSh('<div class="sh-h"><div class="big" style="font-size:28px;margin:0">Réglages</div><button class="gb" onclick="closeSh()" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
   '<div class="lab" style="margin:6px 4px 6px">Ton prénom</div><input id="cn" class="g srch" autocomplete="off" placeholder="Prénom" value="'+esc(uname())+'" oninput="try{localStorage.setItem(\'forme_name\',this.value)}catch(e){}setHead();paintAvatar()">'+

   '<button class="g setrow tap" style="width:100%;text-align:left" onclick="openPetRoom()"><div><b style="font-weight:600">Personnaliser ta mascotte 🐾</b><div class="note">Chat, chien ou requin, tenues, notifications</div></div><svg viewBox="0 0 24 24" style="width:18px;height:18px;color:var(--m)"><path d="M9 6l6 6-6 6"/></svg></button>'+
   (live()?'<button class="g pill" style="width:100%;padding:14px;margin-bottom:22px" onclick="closeSh();load(true)">Actualiser mes données</button>':'')+
   '<button class="g setrow tap" style="width:100%;text-align:left" onclick="closeSh();openOB(1)"><div><b style="font-weight:600">Modifier mon profil 👤</b><div class="note">Objectif, habitudes, cibles</div></div><svg viewBox="0 0 24 24" style="width:18px;height:18px;color:var(--m)"><path d="M9 6l6 6-6 6"/></svg></button>'+
   '<div class="lab" style="margin:8px 4px 4px;font-size:15px;color:var(--t);font-weight:600">Connexion à ta feuille</div>'+
   '<div class="note" style="margin:0 4px 14px;line-height:1.5">Ces informations restent uniquement sur ce téléphone.</div>'+
   '<div class="lab" style="margin:0 4px 6px">Lien de ta feuille (se termine par /exec)</div><input id="cu" class="g srch" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(c.url||'')+'">'+
   '<div class="lab" style="margin:16px 4px 6px">Code secret</div><input id="ck" class="g srch" type="password" autocomplete="off" placeholder="Le code choisi dans Code.gs" value="'+esc(c.key||'')+'">'+
   '<div id="cm" class="note" style="margin:14px 4px;min-height:18px"></div>'+
   '<button class="g pill on" style="width:100%;padding:14px" onclick="saveSet()">Enregistrer et charger</button>'+
   (c.url?'<button class="g pill" style="width:100%;padding:14px;margin-top:10px" onclick="resetSet()">Déconnecter et revenir à la démo</button>':'')+
   (LAST?'<div class="note" style="margin-top:18px;text-align:center">Dernière mise à jour à '+new Date(LAST).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</div>':''));
  document.body.classList.add('full');
}
function saveSet(){
  var u=$('#cu').value.trim().split('?')[0],k=$('#ck').value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){$('#cm').innerHTML='<span class="tko">Colle le lien complet, celui qui se termine par /exec.</span>';return}
  if(!k){$('#cm').innerHTML='<span class="tko">Saisis ton code secret.</span>';return}
  $('#cm').textContent='Connexion…';var old=CFG;CFG={url:u,key:k};
  call('list').then(function(){
    try{localStorage.setItem('forme_cfg',JSON.stringify(CFG))}catch(e){}
    $('#cm').innerHTML='<span class="tok">Connecté ✓</span>';D=null;
    setTimeout(function(){closeSh();load(true)},700);
  }).catch(function(e){CFG=old;$('#cm').innerHTML='<span class="tko">'+esc(e.message||e)+'</span>'});
}
function resetSet(){CFG=null;D=null;try{localStorage.removeItem('forme_cfg');localStorage.removeItem('forme_cache')}catch(e){}closeSh();load()}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&TAB==='moi'){start3d();tmTick();tmSched()}if(!document.hidden&&live()&&!gs()&&Date.now()-LAST>5*60e3){load()}});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!gs()){navigator.serviceWorker.register('sw.js').catch(function(){})}
pLoad();
petInit();
load();
petGreet();
